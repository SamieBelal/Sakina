<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Sakina empty-state: Journal (quill on parchment). Palette: emerald #1B6B4A, gold #C8985E. -->

  <!-- Decorative geometric accent removed 2026-05-25 — at 6% opacity on
       cream it read as a visible ✕ glyph rather than a subtle pattern.
       The parchment + quill on its own carries the empty state. -->


  <!-- Parchment leaf -->
  <g transform="translate(40 60)">
    <path d="M0 8 Q0 0 8 0 L98 0 Q106 0 106 8 L106 92 Q106 100 98 100 L8 100 Q0 100 0 92 Z"
          fill="#F5EBD9" opacity="0.55" />
    <!-- ruled lines -->
    <line x1="14" y1="22" x2="92" y2="22" stroke="#C8985E" stroke-width="0.8" opacity="0.4" />
    <line x1="14" y1="38" x2="78" y2="38" stroke="#C8985E" stroke-width="0.8" opacity="0.4" />
    <line x1="14" y1="54" x2="84" y2="54" stroke="#C8985E" stroke-width="0.8" opacity="0.4" />
    <line x1="14" y1="70" x2="62" y2="70" stroke="#C8985E" stroke-width="0.8" opacity="0.3" />
  </g>

  <!-- Quill: angled stroke, emerald shaft, gold nib -->
  <g transform="translate(86 38) rotate(28)" stroke-linecap="round" stroke-linejoin="round">
    <!-- feather body -->
    <path d="M0 0 C 10 -14, 24 -22, 42 -26 C 38 -10, 28 4, 14 12 Z"
          fill="#1B6B4A" opacity="0.85" />
    <!-- feather veins -->
    <path d="M4 -2 C 14 -10, 24 -16, 38 -22" stroke="#FBF7F2" stroke-width="0.8" opacity="0.55" fill="none" />
    <path d="M8 4  C 18 -4, 26 -10, 36 -16"  stroke="#FBF7F2" stroke-width="0.8" opacity="0.45" fill="none" />
    <!-- shaft -->
    <path d="M0 0 L -42 56" stroke="#1B6B4A" stroke-width="2.2" fill="none" />
    <!-- nib -->
    <path d="M-42 56 L -50 66 L -46 60 Z" fill="#C8985E" />
  </g>

  <!-- Ink dot below nib -->
  <circle cx="44" cy="148" r="2.4" fill="#1B6B4A" opacity="0.7" />
</svg>
