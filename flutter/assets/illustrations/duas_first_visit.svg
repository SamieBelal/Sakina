<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Sakina empty-state: Duas (open book / mushaf spread).
       Used optionally as a hero for a first-visit "Browse duas by theme" header
       before the user has saved any. -->

  <!-- 6% opacity geometric accent in top-left -->
  <g opacity="0.06" stroke="#1B6B4A" stroke-width="1" fill="none">
    <circle cx="38" cy="40" r="20" />
    <path d="M22 40 L 54 40 M 38 24 L 38 56 M 27 29 L 49 51 M 49 29 L 27 51" />
  </g>

  <!-- Open mushaf (book) -->
  <g transform="translate(100 110)">
    <!-- Left page -->
    <path d="M-72 -40 Q -72 -44, -68 -44 L -4 -44 Q 0 -44, 0 -38 L 0 38 Q 0 44, -4 44 L -68 44 Q -72 44, -72 40 Z"
          fill="#F5EBD9" stroke="#1B6B4A" stroke-width="1.2" opacity="0.92" />
    <!-- Right page -->
    <path d="M72 -40 Q 72 -44, 68 -44 L 4 -44 Q 0 -44, 0 -38 L 0 38 Q 0 44, 4 44 L 68 44 Q 72 44, 72 40 Z"
          fill="#F5EBD9" stroke="#1B6B4A" stroke-width="1.2" opacity="0.92" />
    <!-- Spine shadow -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#1B6B4A" stroke-width="1.4" opacity="0.6" />

    <!-- Left page text lines (gold, faint) -->
    <g stroke="#C8985E" stroke-width="1" opacity="0.55" stroke-linecap="round">
      <line x1="-62" y1="-26" x2="-10" y2="-26" />
      <line x1="-62" y1="-14" x2="-18" y2="-14" />
      <line x1="-62" y1="-2"  x2="-12" y2="-2" />
      <line x1="-62" y1="10"  x2="-20" y2="10" />
      <line x1="-62" y1="22"  x2="-14" y2="22" />
      <line x1="-62" y1="34"  x2="-22" y2="34" />
    </g>

    <!-- Right page text lines -->
    <g stroke="#C8985E" stroke-width="1" opacity="0.55" stroke-linecap="round">
      <line x1="10" y1="-26" x2="62" y2="-26" />
      <line x1="18" y1="-14" x2="62" y2="-14" />
      <line x1="12" y1="-2"  x2="62" y2="-2" />
      <line x1="20" y1="10"  x2="62" y2="10" />
      <line x1="14" y1="22"  x2="62" y2="22" />
      <line x1="22" y1="34"  x2="62" y2="34" />
    </g>
  </g>

  <!-- Small heart in gold above the book (the "save dua" affordance hint) -->
  <g transform="translate(100 48)" fill="#C8985E" opacity="0.85">
    <path d="M0 8 C -10 -2, -16 -8, -10 -14 C -6 -18, -2 -14, 0 -10 C 2 -14, 6 -18, 10 -14 C 16 -8, 10 -2, 0 8 Z" />
  </g>
</svg>
