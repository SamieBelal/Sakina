<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Sakina empty-state: Collection starter ornament (Khatam medallion + flourishes).
       Sits above the "earn your next Name" caption under the seeded starter card. -->

  <!-- Left flourish -->
  <g stroke="#C8985E" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M16 40 Q 44 40, 60 32" opacity="0.7" />
    <path d="M16 40 Q 44 40, 60 48" opacity="0.7" />
    <circle cx="14" cy="40" r="1.6" fill="#C8985E" />
  </g>

  <!-- Center Khatam medallion -->
  <g transform="translate(100 40)" stroke="#1B6B4A" stroke-width="1.3" fill="none">
    <!-- Outer circle -->
    <circle r="18" opacity="0.55" />
    <!-- Eight-point star (two overlapping squares) -->
    <rect x="-12" y="-12" width="24" height="24" opacity="0.9" />
    <rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" opacity="0.9" />
    <!-- Center dot in gold -->
    <circle r="2.2" fill="#C8985E" stroke="none" />
  </g>

  <!-- Right flourish (mirror) -->
  <g stroke="#C8985E" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M184 40 Q 156 40, 140 32" opacity="0.7" />
    <path d="M184 40 Q 156 40, 140 48" opacity="0.7" />
    <circle cx="186" cy="40" r="1.6" fill="#C8985E" />
  </g>
</svg>
